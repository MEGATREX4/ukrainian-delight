plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://jitpack.io/" } // for Porting Lib: Fabric ASM
    maven { // Reach Entity Attributes
        url = "https://maven.jamieswhiteshirt.com/libs-release"
        content { includeGroup("com.jamieswhiteshirt") }
    }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://repo.spongepowered.org/maven"}
}

fabricApi {
    configureDataGeneration {
        modId = "ukrainian_delight"
    }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Dependencies
    modImplementation "maven.modrinth:farmers-delight-refabricated:${project.farmersdelight_version}"

    // Mod Menu (optional)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    
    // Cloth Config (optional)
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
    
    // Jade compatibility
    compileOnly "maven.modrinth:jade:${project.jade_version}"
    
    // Patchouli
    modCompileOnly "maven.modrinth:Patchouli:${project.patchouli_version}"
    
    // Fabric ASM
    include(modImplementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}")) {
        exclude (group: "net.fabricmc.fabric-api")
    }

    // Porting Lib modules
    for (String module in port_lib_modules.split(",")) {
        include(modApi("io.github.fabricators_of_create.Porting-Lib:$module:$port_lib_version"))
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    
    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
